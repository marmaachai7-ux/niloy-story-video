
name: Render Niloy Story

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Upload MP4 video
        uses: actions/upload-artifact@v4
        with:
          name: niloy-story-video
          path: out/niloy-story.mp4
          if-no-files-found: error
          retention-days: 7
